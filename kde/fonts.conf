<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Pinky rice: шрифты по умолчанию для всех программ -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Nunito</family><family>Noto Sans</family><family>Symbols Nerd Font</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family><family>Symbols Nerd Font Mono</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Nunito</family></prefer></alias>
</fontconfig>
